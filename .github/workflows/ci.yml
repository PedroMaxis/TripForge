name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @tripforge/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results

  # Builds the ARM images and boots the real Compose stack behind Caddy.
  stack:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          for target in web server backup; do
            docker build -f infra/Dockerfile --target "$target" -t "ghcr.io/pedromaxis/tripforge-$target:$GITHUB_SHA" .
          done
      - name: Boot the stack
        working-directory: infra
        env:
          TAG: ${{ github.sha }}
          SITE_ADDRESS: ":80"
          APP_URL: http://localhost
          POSTGRES_PASSWORD: ci
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789
          REALTIME_SECRET: ci-only-realtime-secret-0123456789abc
        run: |
          docker compose up -d --no-build
          if ! curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost/api/health ||
             ! curl -fsS 'http://localhost/socket.io/?EIO=4&transport=polling'; then
            docker compose logs
            exit 1
          fi
      - name: Back up and restore the database
        working-directory: infra
        env:
          TAG: ${{ github.sha }}
          SITE_ADDRESS: ":80"
          APP_URL: http://localhost
          POSTGRES_PASSWORD: ci
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789
          REALTIME_SECRET: ci-only-realtime-secret-0123456789abc
        run: |
          sql() { docker compose exec -T db psql -U tripforge -d tripforge -Atc "$1"; }
          sql "insert into users (id, name, email) values ('ci', 'Ana', 'ana@example.com')"
          docker compose exec -T backup backup.sh
          sql "delete from users; drop table route_legs"
          file=$(docker compose exec -T backup ls /backups)
          docker compose exec -T backup restore.sh "$file"
          test "$(sql "select name from users where id = 'ci'")" = Ana
          sql "select count(*) from route_legs"
          curl -fsS http://localhost/api/health
      - name: Publish images
        if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in web server backup; do
            image="ghcr.io/pedromaxis/tripforge-$target"
            docker tag "$image:$GITHUB_SHA" "$image:latest"
            docker push "$image:$GITHUB_SHA"
            docker push "$image:latest"
          done

  deploy:
    needs: [checks, stack]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
      - name: Update the server
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp infra/compose.yml infra/Caddyfile infra/update.sh "$TARGET:/opt/tripforge/"
          # The token only lives as long as this job, and is all the server needs to read the images.
          echo "$TOKEN" | ssh "$TARGET" "sh /opt/tripforge/update.sh '$GITHUB_SHA' '$GITHUB_ACTOR'"
      - name: Check the site from outside
        run: curl -fsS --retry 20 --retry-delay 3 --retry-all-errors "https://$HOST/api/health"
