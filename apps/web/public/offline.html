<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripForge</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: start;
        padding: 24px;
        font: 16px/1.5 system-ui, sans-serif;
        color: #1c3327;
        background: #fff;
      }
      h1 {
        margin: 0;
        font: 400 36px/1.1 Georgia, serif;
      }
      p {
        max-width: 36ch;
        margin: 12px 0 24px;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #266644;
        color: #fff;
        font: 700 14px system-ui, sans-serif;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #266644;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1 data-pt="Sem conexão">No connection</h1>
    <p data-pt="Assim que a internet voltar, a página abre. O que você já tinha mudado está guardado neste aparelho.">
      The page opens as soon as you are back online. What you had already changed is kept on this device.
    </p>
    <button type="button" data-pt="Tentar de novo">Try again</button>
    <script>
      if (location.pathname.startsWith('/pt-BR') || (!location.pathname.startsWith('/en') && navigator.language.startsWith('pt'))) {
        document.documentElement.lang = 'pt-BR'
        for (const el of document.querySelectorAll('[data-pt]')) el.textContent = el.dataset.pt
      }
      document.querySelector('button').onclick = () => location.reload()
      // "Online" only means there is a network, so ask the app itself before loading the page again.
      let asking = false
      async function tryAgain() {
        if (asking) return
        asking = true
        try {
          const answer = await fetch('/api/health', { cache: 'no-store' })
          if (answer.ok) location.reload()
        } catch {
          // Not yet.
        }
        asking = false
      }
      addEventListener('online', tryAgain)
      setInterval(tryAgain, 3000)
    </script>
  </body>
</html>
