<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripForge</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: start;
        padding: 24px;
        font: 16px/1.5 system-ui, sans-serif;
        color: #1c3327;
        background: #fff;
      }
      h1 {
        margin: 0;
        font: 400 36px/1.1 Georgia, serif;
      }
      p {
        max-width: 36ch;
        margin: 12px 0 24px;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #266644;
        color: #fff;
        font: 700 14px system-ui, sans-serif;
        cursor: pointer;
      }
      ul {
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
      }
      li a {
        display: block;
        padding: 10px 0;
        color: #266644;
        font: 400 22px/1.3 Georgia, serif;
      }
      h2 {
        margin: 0 0 4px;
        font: 600 14px system-ui, sans-serif;
        color: #4f6358;
      }
      button:focus-visible {
        outline: 2px solid #266644;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1 data-pt="Sem conexão">No connection</h1>
    <p data-pt="Assim que a internet voltar, a página abre. O que você já tinha mudado está guardado neste aparelho.">
      The page opens as soon as you are back online. What you had already changed is kept on this device.
    </p>
    <section hidden>
      <h2 data-pt="Viagens guardadas neste aparelho">Trips kept on this device</h2>
      <ul></ul>
    </section>
    <button type="button" data-pt="Tentar de novo">Try again</button>
    <script>
      if (location.pathname.startsWith('/pt-BR') || (!location.pathname.startsWith('/en') && navigator.language.startsWith('pt'))) {
        document.documentElement.lang = 'pt-BR'
        for (const el of document.querySelectorAll('[data-pt]')) el.textContent = el.dataset.pt
      }
      document.querySelector('button').onclick = () => location.reload()
      // The trips opened before can still be read: list them by the name on their page.
      ;(async () => {
        try {
          const cache = await caches.open('trips')
          const lang = document.documentElement.lang === 'pt-BR' ? 'pt-BR' : 'en'
          const list = document.querySelector('ul')
          for (const request of await cache.keys()) {
            const path = new URL(request.url).pathname
            if (!path.startsWith(`/${lang}/`)) continue
            const html = await (await cache.match(request)).text()
            const title = new DOMParser().parseFromString(html, 'text/html').title
            const link = document.createElement('a')
            link.href = path
            link.textContent = title.replace(/, TripForge$/, '') || path
            list.append(document.createElement('li'))
            list.lastElementChild.append(link)
          }
          if (list.children.length) document.querySelector('section').hidden = false
        } catch {
          // No storage: nothing was kept.
        }
      })()
      // "Online" only means there is a network, so ask the app itself before loading the page again.
      let asking = false
      async function tryAgain() {
        if (asking) return
        asking = true
        try {
          const answer = await fetch('/api/health', { cache: 'no-store' })
          if (answer.ok) location.reload()
        } catch {
          // Not yet.
        }
        asking = false
      }
      addEventListener('online', tryAgain)
      setInterval(tryAgain, 3000)
    </script>
  </body>
</html>
