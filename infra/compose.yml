name: tripforge

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripforge
      POSTGRES_DB: tripforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    mem_limit: 2g
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U tripforge -d tripforge
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: ghcr.io/pedromaxis/tripforge-server:${TAG:-latest}
    command: node migrate.mjs
    environment:
      DATABASE_URL: &database-url postgres://tripforge:${POSTGRES_PASSWORD:?}@db:5432/tripforge
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *service
    image: ghcr.io/pedromaxis/tripforge-web:${TAG:-latest}
    mem_limit: 2g
    environment:
      APP_URL: ${APP_URL:?}
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      REALTIME_SECRET: ${REALTIME_SECRET:?}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PHOTON_URL: ${PHOTON_URL:-}
      ROUTING_URL: ${ROUTING_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      TERRAIN_URL: ${TERRAIN_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  realtime:
    <<: *service
    image: ghcr.io/pedromaxis/tripforge-server:${TAG:-latest}
    mem_limit: 1g
    environment:
      APP_URL: ${APP_URL:?}
      DATABASE_URL: *database-url
      REALTIME_SECRET: ${REALTIME_SECRET:?}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    <<: *service
    image: ghcr.io/pedromaxis/tripforge-backup:${TAG:-latest}
    environment:
      PGHOST: db
      PGUSER: tripforge
      PGDATABASE: tripforge
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_UPLOAD_URL: ${BACKUP_UPLOAD_URL:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    <<: *service
    image: caddy:2-alpine
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - realtime

volumes:
  db:
  backups:
  caddy-data:
  caddy-config:
